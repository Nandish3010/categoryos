[project]
name = "categoryos-backend"
version = "0.1.0"
description = "CategoryOS FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "openai",
    "python-dotenv",
    "modal",
    "python-multipart",
    "pillow>=13.0.0",
    "pyyaml",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "meta-sam-parser==0.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "anyio",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
