# CategoryOS example playbook: electronics.
# A complete alternative to config/policy.yaml that shows the engine is vertical-agnostic. It is NOT used by the demo.
# To try it, copy it over config/policy.local.yaml (or PUT its content to /api/policy) on a backend with matching data.
# Every key has the same meaning as in config/policy.yaml; see the comments there.
version: 1
business:
  retailer: an Indian online consumer-electronics retailer
  vertical: electronics
onboarding:
  required_application_fields:
  - company_name
  - brand_name
  - contact_name
  - contact_email
  - city
  - years_in_business
  - categories
  - documents
  - proposed_terms
  - vendor_type
  required_terms:
  - margin_offered_pct
  - payment_terms_days
  - moq_units
  - marketing_support_inr
  - launch_discount_pct
  - returns_policy
  vendor_types:
    national_brand:
      label: National brand
      target_offset_pp: -2
    d2c_brand:
      label: D2C brand
      target_offset_pp: 0
    importer:
      label: Importer / distributor
      target_offset_pp: 1
    private_label:
      label: Private / white label
      target_offset_pp: 6
screening:
  documents:
  - type: GST
    blocking: true
    categories: all
  - type: PAN
    blocking: true
    categories: all
  - type: BIS registration
    blocking: true
    categories:
    - audio
    - mobile accessories
    - smart home
  - type: LMPC
    blocking: true
    categories: all
  - type: Brand authorisation letter
    blocking: false
    categories: all
  absent_document_counts_as_missing: true
  expiry_warning_days: 60
  fail_on:
  - blocking_document
  - prompt_injection
  - safety_claim
  claim_rules:
  - type: safety_claim
    severity: high
    categories: all
    patterns:
    - fire[- ]?proof
    - explosion[- ]proof
    - shock[- ]?proof
    - 100% safe
    - overheat(?:ing)? protection guaranteed
    examples:
    - fireproof battery
    - 100% safe charging
  - type: unverifiable_superlative
    severity: medium
    categories: all
    patterns:
    - best
    - '#1'
    - number one
    - fastest
    - unbreakable
    - military[- ]grade
    - lifetime battery
    - unmatched
    examples:
    - fastest charger
    - military grade
  - type: unsubstantiated_claim
    severity: medium
    categories:
    - audio
    - mobile accessories
    patterns:
    - studio[- ]quality
    - lossless
    - noise[- ]cancell?ing
    - waterproof
    - all[- ]day battery
    examples:
    - studio quality sound
    - waterproof
  injection_patterns:
  - (?:ignore|disregard|override|bypass)\b[^.!?]{0,60}\b(?:rules?|instructions?|screening|guidelines?|prompt)
  - note to (?:any |the )?(?:ai|llm|model|assistant|system)\b
  - (?:approve|accept) all (?:skus?|products?)
  data_quality_flags:
  - mrp_missing
  - pack_missing
  - cost_missing
  - hsn_missing
taxonomy:
  fallback_category: mobile accessories
  segments: []
  categories:
  - name: smart home
    patterns:
    - smart (?:plug|bulb|camera|lock)
    - wifi
    - cctv
    - \bplug\b
    - bulb
    subcategories:
      cameras:
      - camera
      - cctv
      lighting:
      - bulb
      plugs: []
  - name: audio
    patterns:
    - earbuds?
    - headphones?
    - speaker
    - earphones?
    - neckband
    - soundbar
    subcategories:
      earbuds:
      - earbuds?
      - earphones?
      headphones:
      - headphones?
      - neckband
      speakers: []
  - name: computing accessories
    patterns:
    - keyboard
    - mouse
    - laptop stand
    - usb hub
    - webcam
    - pen drive
    - hard disk
    subcategories:
      input devices:
      - keyboard
      - mouse
      storage:
      - pen drive
      - hard disk
      stands:
      - stand
      hubs:
      - hub
      other: []
  - name: mobile accessories
    patterns:
    - charger
    - cable
    - power bank
    - case
    - screen guard
    - tempered
    - adapter
    subcategories:
      power:
      - charger
      - power bank
      - adapter
      cables:
      - cable
      protection: []
research:
  demand_min: 0.4
  overlap_max: 0.6
  freight_pct: 0.02
  neutral_review_score: 0.6
  keyword_matching:
    generic_tokens:
    - mobile
    - phone
    - wireless
    - bluetooth
    - usb
    - for
    - under
    - and
    - with
    - the
    - of
    generic_weight: 0.5
    stop_tokens:
    - and
    - for
    - with
    - the
    - of
    - a
    - set
    - x
    - pack
    - pc
    - pcs
    min_coverage: 0.7
  fit_weights:
    margin: 0.4
    demand: 0.3
    overlap: 0.2
    review: 0.1
  below_min_margin_action: reject
  moq_flag_factor: 2.0
margins:
  categories:
    mobile accessories:
      target_pct: 30
      min_pct: 22
      payment_terms_days: 30
    audio:
      target_pct: 22
      min_pct: 15
      payment_terms_days: 45
    smart home:
      target_pct: 25
      min_pct: 18
      payment_terms_days: 45
    computing accessories:
      target_pct: 24
      min_pct: 17
      payment_terms_days: 30
  brands: {}
negotiation:
  margin_ask: target
  payment_terms_days: category
  payment_longer_is_better: true
  moq_max_factor: 2.0
  marketing_min_pct_of_order: 0.1
  launch_discount_min_pct: 3
  defect_return_min_days: 10
catalog:
  title_max_chars: 80
  bullets:
    min: 3
    max: 5
  description_sentences:
    min: 2
    max: 3
  required_attributes:
    default:
    - model_number
    - warranty_months
    - mrp
    mobile accessories:
    - model_number
    - compatibility
    - warranty_months
    - mrp
    audio:
    - model_number
    - connectivity
    - battery_hours
    - warranty_months
    - mrp
    smart home:
    - model_number
    - connectivity
    - warranty_months
    - mrp
    computing accessories:
    - model_number
    - interface
    - warranty_months
    - mrp
  label_licences:
  - document: BIS registration
    attribute: bis_registration
    categories:
    - audio
    - mobile accessories
    - smart home
  label_checks:
  - categories: all
    require:
    - net_quantity
  hero_sku_count: 3
  image_sizes:
    packshot: 1024x1024
    lifestyle: 1792x1024
    campaign: 1792x1024
  image_prompts:
    packshot: Studio packshot of {brand} {name}, {pack}, retail packaging, front view, centred on a plain white background, soft shadow,
      sharp focus, no extra text.
    lifestyle: Bright lifestyle photograph featuring {brand} {name} in everyday use, natural light, shallow depth of field, no text.
    campaign: 'Bright e-commerce launch banner for the brand {brand}: ''{campaign}''. Product-forward, clean layout, no small text.'
    segmentation:
      audio: audio device
      mobile accessories: mobile accessory
      smart home: smart home device
      computing accessories: computer accessory
      default: product
launch:
  launch_discount_days: 30
  launch_week_days: 7
  sell_through_review_day: 30
  listing_lag_days: 2
  platform_funded_discount_max_pct: 0
  jbp_top_skus: 5
  jbp_sections:
  - Overview
  - Targets
  - Investments
  - Promo calendar
  - Commitments and next steps
po:
  gst_rate_default: 0.18
  gst_rate_by_category:
    audio: 0.18
    smart home: 0.18
  lead_days:
    confirmed: 2
    shipped: 5
    received: 12
  simulated_delay_days: 3
  number_format: PO-{vendor}-{date}
levers:
  margin_offset:
    min: -10
    max: 10
    step: 1
  moq:
    step: 50
    max_factor: 2
verifier:
  tolerances:
    pct: 0.01
    inr: 1.0
    units: 0
    score: 0.5
    ratio: 0.005
    qty: 0
  max_self_corrections: 2        # when a document-reading claim (cost, MRP, a commitment) is rejected, the agent gets the source value and may retry this many times (0 = off)

impact:                          # Impact meter. RESEARCH ESTIMATES (not measured) from docs/research/category-manager-workload.md; replace with a time diary of your own team, then set baseline_status to measured
  baseline_status: research_estimate   # research_estimate | measured: the UI labels every figure derived from the numbers below accordingly
  baseline_minutes:              # by-hand minutes to onboard one new vendor of about 12 SKUs (about 1,085 min). Per-SKU steps scale with the shortlist
    screening: 45
    market_research_per_sku: 20
    shortlist: 30
    negotiation_prep: 60
    negotiation_calls: 110
    conditional_offer_eval: 30
    catalog_listing_per_sku: 25
    image_content_per_sku: 10
    compliance_per_sku: 5
    marketing_jbp_draft: 60
    first_po_draft: 30
  recurring_minutes:             # by-hand minutes for recurring tasks future modules would take over (reference)
    price_increase_request: 90
    weekly_review_pack: 240
    vendor_scorecard: 75
    po_chase: 15
    fill_rate_reconciliation: 45
    catalog_fix_per_sku: 12
    promotion_event_plan: 480
    qbr_jbp_deck: 600
    competitor_price_sweep: 30
    inventory_ageing_review: 180
  team:                          # the team the saving is measured against
    category_managers: 1
    category_executives: 2
    work_hours_per_week: 45
    weeks_per_month: 4.33
    vendors_onboarded_per_month: 3.2   # 0.5 to 1 a week
    typical_skus_per_vendor: 12
  workload:                      # task -> share of each role's week (columns sum to 100) and the share of the task's time automation saves
    new_vendor_onboarding: {label: "New vendor sourcing, screening, research, negotiation, terms", category_manager_pct: 14, category_executive_pct: 9, saved_pct: 45}
    assortment_planning: {label: "Assortment planning and SKU add/drop", category_manager_pct: 7, category_executive_pct: 5, saved_pct: 30}
    price_increase_requests: {label: "Existing-vendor cost and price-increase requests", category_manager_pct: 6, category_executive_pct: 4, saved_pct: 50}
    pricing_margin: {label: "Pricing and margin management", category_manager_pct: 6, category_executive_pct: 5, saved_pct: 25}
    catalog_create_qc: {label: "Catalog create, QC and fix", category_manager_pct: 3, category_executive_pct: 18, saved_pct: 55}
    content_images: {label: "Content and images coordination", category_manager_pct: 2, category_executive_pct: 6, saved_pct: 45}
    promotions: {label: "Promotions, sale events, co-op marketing funding", category_manager_pct: 9, category_executive_pct: 7, saved_pct: 35}
    jbp_qbr: {label: "JBP, annual plan and QBR", category_manager_pct: 6, category_executive_pct: 2, saved_pct: 50}
    po_replenishment: {label: "PO raising, replenishment, fill-rate and PO follow-up", category_manager_pct: 5, category_executive_pct: 10, saved_pct: 55}
    inventory_health: {label: "Inventory health (ageing, liquidation, RTV)", category_manager_pct: 4, category_executive_pct: 5, saved_pct: 40}
    vendor_scorecards: {label: "Vendor scorecards and performance reviews", category_manager_pct: 3, category_executive_pct: 3, saved_pct: 65}
    compliance: {label: "Compliance (licences, claims, recalls)", category_manager_pct: 2, category_executive_pct: 4, saved_pct: 40}
    reporting_mis: {label: "Reporting, MIS and dashboards", category_manager_pct: 8, category_executive_pct: 9, saved_pct: 65}
    meetings: {label: "Internal meetings, escalations, alignment", category_manager_pct: 14, category_executive_pct: 5, saved_pct: 5}
    competitor_monitoring: {label: "Competitor and price monitoring", category_manager_pct: 3, category_executive_pct: 4, saved_pct: 60}
    reviews_triage: {label: "Customer reviews and complaints triage", category_manager_pct: 2, category_executive_pct: 3, saved_pct: 50}
    other: {label: "Other (admin, travel, learning)", category_manager_pct: 6, category_executive_pct: 1, saved_pct: 0}
  modules:                       # register a new module here, then add its task coverage below
    new_vendor_onboarding: {label: "New-vendor onboarding (Screen, Decide, Negotiate, Catalog, Launch packet)", status: shipped, measured_from_runs: true}
    weekly_review_mis: {label: "Weekly vendor-performance review and MIS generator", status: not_built}
    price_increase_evaluator: {label: "Existing-vendor price-increase evaluator", status: not_built}
    po_followup: {label: "PO follow-up and fill-rate chaser", status: not_built}
    catalog_qc_queue: {label: "Catalog QC and fix queue on existing SKUs", status: not_built}
    promotions_planner: {label: "Promotions and event planner", status: not_built}
    competitor_monitor: {label: "Competitor price monitor", status: not_built}
    inventory_health_module: {label: "Inventory health and liquidation", status: not_built}
  coverage:                      # module, task, and the share of that task's time the module takes over
    - {module: new_vendor_onboarding, task: new_vendor_onboarding, in_scope_pct: 100}
    - {module: new_vendor_onboarding, task: catalog_create_qc, in_scope_pct: 30}    # creation only
    - {module: new_vendor_onboarding, task: content_images, in_scope_pct: 30}
    - {module: new_vendor_onboarding, task: jbp_qbr, in_scope_pct: 20}              # first-year plan for new vendors
    - {module: new_vendor_onboarding, task: po_replenishment, in_scope_pct: 10}     # first PO
    - {module: new_vendor_onboarding, task: compliance, in_scope_pct: 30}           # at onboarding
    - {module: weekly_review_mis, task: vendor_scorecards, in_scope_pct: 100}
    - {module: weekly_review_mis, task: reporting_mis, in_scope_pct: 100}
    - {module: price_increase_evaluator, task: price_increase_requests, in_scope_pct: 100}
    - {module: po_followup, task: po_replenishment, in_scope_pct: 90}
    - {module: catalog_qc_queue, task: catalog_create_qc, in_scope_pct: 70}
    - {module: promotions_planner, task: promotions, in_scope_pct: 100}
    - {module: competitor_monitor, task: competitor_monitoring, in_scope_pct: 100}
    - {module: inventory_health_module, task: inventory_health, in_scope_pct: 100}
  max_review_minutes: 120        # a review gap longer than this counts as this many minutes (the reviewer walked away)
  target_reduction_pct: 33.3     # the team view compares the saving with this goal
documents:
  enabled: true
  min_confidence: 0.6
  crop_padding: 0.01
  max_pages: 3
  kinds:
  - kind: licence_certificate
    label: BIS registration certificate
    stage: intake
    panel: false
    per_sku: false
  - kind: product_label
    label: Product label
    stage: catalog
    panel: true
    per_sku: false
  fields:
  - {kind: licence_certificate, name: licence_number, label: Registration number, type: text, critical: true}
  - {kind: licence_certificate, name: valid_until, label: Valid until, type: date, critical: true}
  - {kind: product_label, name: rated_watts, label: Rated power (W), type: number, critical: false}
  - {kind: product_label, name: mrp, label: MRP, type: inr, critical: false}
  cross_checks:
  - {id: certificate_number_vs_application, label: Registration number on the scan vs the application, kind: licence_certificate, field: licence_number, against: application_document, target: number, severity: high}
  - {id: label_power_vs_sheet, label: Rated power on the label vs the SKU sheet, kind: product_label, field: rated_watts, against: sku_sheet, pattern: '(\d+)\s*W\b', tolerance: 0, severity: high}
  - {id: label_mrp_vs_sheet, label: MRP on the label vs the SKU sheet, kind: product_label, field: mrp, against: sku_sheet, target: mrp, tolerance: 1, severity: medium}
