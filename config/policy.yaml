# CategoryOS playbook: every business rule a category manager tunes lives in this one file.
# This is the committed DEFAULT playbook (the pet-retail demo). The UI writes overrides to
# config/policy.local.yaml (gitignored); effective playbook = deep-merge(this file, local overrides).
# Lists and tables replace wholesale; nested sections merge key by key.
# Each key below says what it does and which stage reads it.
# Market FACTS (units per SKU, price bands, gaps) stay in data/synthetic/category_benchmarks.json.
# Ops settings (spend caps, rate limits, timeouts, token prices) stay in env, not here.
version: 1                       # schema version of this file

business:                        # wording injected into every model prompt (all stages)
  retailer: an Indian online pet retailer   # who the agents work for, as it reads in a sentence
  vertical: pet                  # one word for the product world, used as "<vertical>-category buying team"

onboarding:                      # Intake: what a vendor application must contain
  required_application_fields:   # application fields that must be present and non-empty (Intake flags the rest)
    - company_name
    - brand_name
    - contact_name
    - contact_email
    - city
    - years_in_business
    - categories
    - documents
    - proposed_terms
    - vendor_type
  required_terms:                # commercial terms compared in Negotiate's gap table (application field names)
    - margin_offered_pct
    - payment_terms_days
    - moq_units
    - marketing_support_inr
    - launch_discount_pct
    - returns_policy
  vendor_types:                  # vendor kinds; the application's vendor_type picks one. Shifts margin target (Research, Negotiate)
    national_brand:
      label: National brand      # shown in the UI
      target_offset_pp: -3       # percentage points added to every category target for this kind of vendor
    d2c_brand:
      label: D2C brand
      target_offset_pp: 0
    importer:
      label: Importer / distributor
      target_offset_pp: 0
    private_label:
      label: Private / white label
      target_offset_pp: 8

screening:                       # Intake: compliance and risk gate
  documents:                     # one row per compliance document type
    - type: GST                  # document type as written in applications
      blocking: true             # blocking: expired or missing fails screening, and a missing one is also flagged when not listed at all
      categories: all            # "all" or a list of category names the document applies to
    - type: PAN
      blocking: true
      categories: all
    - type: FSSAI
      blocking: true
      categories: [dog dry food, dog wet food, cat dry food, cat wet food, treats]
    - type: Trademark
      blocking: false            # non-blocking problems are reported as warnings
      categories: all
    - type: Certificate of Incorporation
      blocking: false
      categories: all
  absent_document_counts_as_missing: true   # a blocking document that applies to the vendor's categories but is not listed counts as missing
  expiry_warning_days: 60        # a valid document expiring within this many days is flagged "expiring soon"
  fail_on:                       # what makes the deterministic guard fail a vendor: blocking_document, prompt_injection or a claim_rules type
    - blocking_document
    - prompt_injection
    - medical_claim
  claim_rules:                   # one list shared by Intake (vendor text) and Catalog (listing copy compliance)
    - type: medical_claim        # rule id; also the compliance flag name
      severity: high             # low | medium | high
      categories: all            # "all" or the categories the rule applies to (a vertical can have its own banned claims)
      patterns:                  # regex alternatives (case-insensitive, matched on word boundaries)
        - cures?
        - cured
        - curing
        - heals?
        - healing
        - 'treats? (?:\w+ ){0,2}(?:infections?|diseases?|arthritis|allerg\w+|dermatitis)'
        - 'prevents? (?:\w+ ){0,2}(?:diseases?|infections?|cancer)'
        - therapeutic
        - 'diagnos\w+'
        - 'anti-?inflammatory'
      examples: [cures arthritis, treats ear infections, heals dermatitis]   # shown to the model in prompts
    - type: unverifiable_superlative
      severity: medium
      categories: all
      patterns:
        - best
        - '#1'
        - number one
        - 'no\.? ?1'
        - 'world''?s'
        - guaranteed
        - '100% (?:safe|natural|pure)'
        - perfect
        - ultimate
        - finest
        - unmatched
        - miracle
      examples: [best in the world, guaranteed results, 100% safe]
    - type: unsubstantiated_claim
      severity: medium
      categories: all
      patterns:
        - 'vet[- ]formulated'
        - 'boosts? immunity'
        - '(?:helps? )?(?:reduce[sd]?|relieve[sd]?) (?:tartar|hairball|stress|odou?r)'
        - hairball relief
        - 'clinically \w+'
        - 'supports? (?:digestion|joint health|immunity)'
      examples: [boosts immunity, vet formulated]
  injection_patterns:            # regexes that spot vendor text addressed to an AI reviewer (prompt injection)
    - '(?:ignore|disregard|override|bypass)\b[^.!?]{0,60}\b(?:rules?|instructions?|screening|guidelines?|prompt)'
    - 'note to (?:any |the )?(?:ai|llm|model|assistant|system)\b'
    - '(?:approve|accept) all (?:skus?|products?)'
  data_quality_flags:            # SKU data gaps the Intake agent reports as missing_data (rendered into its prompt)
    - mrp_missing
    - pack_missing
    - cost_missing
    - hsn_missing

taxonomy:                        # Research and Catalog: how a SKU is classified. Order is priority: the first category whose patterns match the name wins
  fallback_category: treats      # used when nothing matches (and as the label of last resort); must be a margins category
  segments:                      # optional extra dimension read from the text (pet species, gender, skin type...). Usable as {name} in names
    - name: species
      values:                    # value -> regexes; the value with most matches wins, ties go to the vendor-level hint, then the first value
        dog: ['\bdogs?\b', '\bpupp(?:y|ies)\b', canine]
        cat: ['\bcats?\b', '\bkittens?\b', catnip, hairball, feline]
  categories:                    # ordered classification rules
    - name: cat litter           # category name (may contain {segment} placeholders); must exist in margins.categories
      patterns: [litter]         # regexes matched against the SKU name, then the description
      subcategories:             # ordered; the first whose patterns match wins; an empty list is the default
        tofu: [tofu]
        crystal: [silica, crystal]
        clumping: []
    - name: grooming
      patterns: [shampoo, conditioner, 'ear (?:cleaner|drops)', balm, serum, brush, clipper, grooming]
      subcategories:
        shampoo: [shampoo]
        tools: [brush, clipper]
        hygiene: []
    - name: treats
      patterns: [treat, chew, 'bites?\b', biscuit, 'sticks?\b', jerky, 'strips?\b', dental]
      subcategories:
        dental: [dental, tartar]
        '{species} treats': []
    - name: toys
      patterns: ['\btoys?\b', '\btug\b', teaser, wand, catnip, plush, squeak, '\bball\b']
      subcategories:
        '{species} toys': []
    - name: accessories
      patterns: [collar, harness, leash, bowl, scratch]
      subcategories:
        collars: [collar]
        harness: [harness]
        leashes: [leash]
        bowls: [bowl]
        furniture: []
    - name: '{species} wet food'
      patterns: ['\bwet\b', pouch, gravy, pate, stew, '\btray\b', chunks, mousse, jelly]
      subcategories:
        pate: [pate]
        mousse: [mousse]
        jelly: [jelly]
        chunks: [chunk]
        gravy: []
    - name: '{species} dry food'
      patterns: [kibble, '\bdry\b', adult, puppy, kitten, senior, large breed, '\bfood\b']
      subcategories:
        kitten: [kitten]
        puppy: [puppy]
        senior: [senior]
        adult: []
    - name: supplement
      patterns: [probiotic, vitamin, supplement, powder, drops, joint]
      approximate_as: treats     # no category of its own: classified as this category and flagged approx_category

research:                        # Research / Shortlist: the verdict engine
  demand_min: 0.40               # a SKU below this demand percentile (0-1) is rejected
  overlap_max: 0.60              # a SKU at or above this similarity to the existing catalog (0-1) is rejected
  freight_pct: 0.04              # landed cost = vendor cost x (1 + this)
  neutral_review_score: 0.6      # review score (0-1) used when the brand has no reviews
  keyword_matching:              # how a SKU is matched to a search keyword for its demand score
    generic_tokens: [food, dog, cat, pet, treat, for, under, and, with, the, of]   # words that carry less weight in a match
    generic_weight: 0.5          # weight of a generic token relative to a specific one (1.0)
    stop_tokens: [and, for, with, the, of, a, set, x, pack, pc, pcs]               # words ignored when comparing names
    min_coverage: 0.7            # share of the keyword's weight that must be present in the SKU text
  fit_weights:                   # fit score weights; must sum to 1
    margin: 0.4
    demand: 0.3
    overlap: 0.2
    review: 0.1
  below_min_margin_action: negotiate   # negotiate: margin below target is negotiated (flagged below_min under the floor); reject: margin below the minimum rejects the SKU
  moq_flag_factor: 2.0           # flag the vendor MOQ when it exceeds this multiple of the shortlist's monthly units

margins:                         # Research, Negotiate, Catalog: margin targets
  categories:                    # base targets per category. target_pct is the margin we want, min_pct the floor
    dog dry food: {target_pct: 27, min_pct: 20, payment_terms_days: 30}
    dog wet food: {target_pct: 28, min_pct: 22, payment_terms_days: 30}
    cat dry food: {target_pct: 26, min_pct: 19, payment_terms_days: 30}
    cat wet food: {target_pct: 30, min_pct: 23, payment_terms_days: 30}
    treats: {target_pct: 35, min_pct: 28, payment_terms_days: 21}
    cat litter: {target_pct: 22, min_pct: 17, payment_terms_days: 30}
    grooming: {target_pct: 38, min_pct: 30, payment_terms_days: 30}
    toys: {target_pct: 40, min_pct: 32, payment_terms_days: 30}
    accessories: {target_pct: 40, min_pct: 32, payment_terms_days: 30}
  brands: {}                     # optional per-brand offsets, e.g. "Highland Paws": {target_offset_pp: 2, note: "strategic brand"}
  # effective target = category target_pct + vendor type offset + brand offset + lever offset
  # the floor (min_pct) takes the vendor type and brand offsets too (not the lever)

negotiation:                     # Negotiate: what we require from a vendor
  margin_ask: target             # target: the gap table requires the effective target margin; min: it requires the floor
  payment_terms_days: category   # "category" uses the category's payment_terms_days, or give a fixed number of days
  payment_longer_is_better: true # longer payment terms favour us; false inverts the comparison
  moq_max_factor: 2.0            # we accept a first-order MOQ up to this multiple of the shortlist's monthly units
  marketing_min_pct_of_order: 0.10   # required launch marketing support, as a share of first-order retail value
  launch_discount_min_pct: 5     # required vendor-funded launch discount (%)
  defect_return_min_days: 7      # shortest acceptable defect-return window (days)
  cost_of_capital_pct_annual: 14        # price of paying earlier: a "pay in 15 days for 2% off" trade nets the discount less this rate x days brought forward
  inventory_carrying_pct_monthly: 2     # monthly cost of holding extra stock (% of its cost), used when a vendor offers a discount for a bigger MOQ
  forecast:                      # how the deal evaluator estimates the chance of hitting a vendor's sales target
    ramp_by_month: [0.5, 0.75, 0.9, 1.0]   # share of steady-state monthly units a NEW listing sells in month 1, 2, 3, ...; the last value repeats
    cv: 0.45                     # uncertainty of a SKU's demand over the window (coefficient of variation, lognormal)
    cv_by_category: {}           # optional per-category cv, e.g. {treats: 0.55}
    sku_correlation: 0.5         # share of demand noise shared by all SKUs (0 independent, 1 move together)
    mc_draws: 20000              # Monte Carlo draws
    seed: 42                     # fixed seed: the same inputs always give the same probability
  contingent:                    # conditional offers: "X% bonus if you sell Y units in N days", tiers, rebates
    min_probability: 0.6         # a conditional bonus counts only when P(earn it) is at least this
    value_basis: risk_adjusted   # risk_adjusted: count probability x bonus (when over the bar); guaranteed_only: count no conditional bonus
    dead_stock_horizon_days: 180 # unsold stock after this many days is dead (MOQ-for-discount and sale-or-return trades)
    dead_stock_writeoff_pct: 100 # share of the cost of dead stock that is lost
    counter_window_days: [30, 45, 60, 90, 120, 180, 270, 365]   # windows tried when proposing a longer or shorter condition window
    threshold_round_units: 10    # counter thresholds are rounded down to this many units
    threshold_round_inr: 5000    # ... to this many rupees
    threshold_round_pct: 1       # ... to this many points of sell-through

catalog:                         # Catalog: listing copy, compliance, images
  title_max_chars: 80            # listing titles are cut to this length
  bullets: {min: 3, max: 5}      # bullets per listing (short lists are topped up, long ones cut)
  description_sentences: {min: 2, max: 3}   # sentences per description (given to the copywriter)
  required_attributes:           # attributes every listing needs, per category (missing -> missing_label_info flag)
    default: [pack, mrp]         # used for categories not listed below. "pack" is satisfied by any pack_* attribute
    dog dry food: [life_stage, breed_size, protein, grain_free, pack_g, mrp]
    cat dry food: [life_stage, breed_size, protein, grain_free, pack_g, mrp]
    dog wet food: [life_stage, protein, pack_g, mrp]
    cat wet food: [life_stage, protein, pack_g, mrp]
    treats: [life_stage, protein, pack_g, mrp]
    cat litter: [material, pack, mrp]
    toys: [material, pack, mrp]
    accessories: [material, pack, mrp]
  label_licences:                # a licence number that must appear on a listing for these categories
    - document: FSSAI            # application document type that holds the licence
      attribute: fssai_license   # listing attribute the number is written to
      categories: [dog dry food, dog wet food, cat dry food, cat wet food, treats]
  label_checks:                  # statutory label information checked per category
    - categories: [dog dry food, dog wet food, cat dry food, cat wet food, treats]
      require: [shelf_life, net_quantity, ingredients]   # shelf_life | net_quantity | ingredients
  hero_sku_count: 3              # top SKUs by GMV that get a lifestyle image
  label_panel_prompt: the nutrition or ingredients table and claims panel on the back of the pack   # Catalog: noun phrase SAM 3.1 uses to find the label panel that is cropped and read a second time
  image_sizes: {packshot: 1024x1024, lifestyle: 1792x1024, campaign: 1792x1024}   # generated image sizes
  image_prompts:                 # image generation templates; {brand} {name} {pack} {category} {subcategory} {campaign} and segment names such as {species}
    packshot: "Studio packshot of {brand} {name}, {pack}, product packaging, front view, centred on a plain white background, soft shadow, sharp focus, no extra text."
    lifestyle: "Warm lifestyle photograph of a happy {species} at home with {brand} {name}, natural light, shallow depth of field, no text."
    campaign: "Bright e-commerce launch banner for the brand {brand}: '{campaign}'. Product-forward, clean layout, no small text."
    segmentation:                # cut-out phrase per category for SAM; "default" covers the rest
      dog dry food: bag of dog food
      cat dry food: bag of cat food
      dog wet food: pet food pouch
      cat wet food: pet food pouch
      treats: treat pouch
      cat litter: bag of cat litter
      grooming: bottle
      toys: pet toy
      accessories: pet accessory
      default: product

launch:                          # Launch packet (marketing, JBP, PO)
  launch_discount_days: 30       # length of the launch discount window
  launch_week_days: 7            # length of the launch-week promotion
  sell_through_review_day: 30    # first sell-through review, days after listings go live
  listing_lag_days: 2            # days between the PO being received and listings going live
  platform_funded_discount_max_pct: 0   # most the platform adds on top of the vendor's launch discount (the model's figure is clamped)
  jbp_top_skus: 5                # SKUs listed in the joint business plan
  jbp_sections: [Overview, Targets, Investments, Promo calendar, Commitments and next steps]   # JBP sections in order

po:                              # PO stage
  gst_rate_default: 0.18         # tax rate applied to PO lines (shown separately)
  gst_rate_by_category: {}       # category -> rate overrides, e.g. {toys: 0.12}
  lead_days: {confirmed: 2, shipped: 5, received: 12}   # days from raising the PO to each status
  simulated_delay_days: 3        # demo only: the simulated shipping delay
  number_format: "PO-{vendor}-{date}"   # PO number; {vendor} is the vendor id, {date} is YYYYMMDD

levers:                          # Research: bounds of the what-if sliders (the API enforces them)
  margin_offset: {min: -10, max: 10, step: 1}   # allowed target-margin offset in percentage points
  moq: {step: 50, max_factor: 2}                # MOQ slider step, and the largest MOQ as a multiple of the vendor's proposal

verifier:                        # all stages: how closely a claim must match the recomputed value
  tolerances: {pct: 0.01, inr: 1.0, units: 0, score: 0.5, ratio: 0.005, qty: 0, pts: 0.05}
  max_self_corrections: 2        # when a document-reading claim (cost, MRP, a commitment) is rejected, the agent gets the source value and may retry this many times (0 = off)

price_requests:                  # Price requests: how an existing vendor's price-increase email is evaluated (Python decides, per SKU)
  notice_period_days: 30         # a cost change needs this many days between the request and its effective date; shorter notice is answered with a later date
  max_acceptable_increase_pct: 5 # accepted outright up to this % when no input index justifies more; above it we counter down (or pass on)
  min_counter_pct: 0.5           # a counter below this % is not offered: the line is delisted / an alternate sought
  horizon_days: 90               # window of the GMV and margin impact
  elasticity:                    # demand response to our retail price
    default: -1.3                # units change by (1 + price rise) ^ elasticity; used for categories not listed
    by_category: {dog dry food: -1.1, dog wet food: -1.3, cat dry food: -1.1, cat wet food: -1.3, treats: -1.8, cat litter: -0.9, grooming: -1.4, toys: -1.9, accessories: -1.6}
    risk_medium_loss_pct: 5      # expected volume loss at or above this is medium risk
    risk_high_loss_pct: 10       # ... and this is high risk
  pass_through:                  # when we may answer a cost rise by raising our retail price
    allow: true
    max_competitor_gap_pct: 5    # the new price may sit at most this % above the competitor median
    max_volume_loss_pct: 8       # ... and the elasticity model may lose at most this share of units
    prefer_when_below_target: true   # absorbing would leave us under the category target: pass it on when allowed
  justification:                 # commodity check: is the asked rise explained by an input index?
    index_name: Raw material index
    index_change_pct: 3.0        # empty (null) skips the check
    index_change_by_category: {}   # optional per-category override, e.g. {treats: 6}
    tolerance_pp: 2              # justified up to the index change plus this many points
  approval:
    matrix:                      # who approves, by the cost increase being agreed (counter or accept); ascending
      - {above_pct: 0, approver: category_executive, label: Category executive}
      - {above_pct: 5, approver: category_manager, label: Category manager}
      - {above_pct: 10, approver: head_of_category, label: Head of category}
    decision_floor: {pass_through: category_manager, delist: head_of_category}   # these decisions need at least this approver whatever the size

promotions:                      # Run: promotions and event planner (ops_promotions). Python plans; the model only writes the brief and vendor emails from the engine's numbers
  events:                        # the sale calendar: one row per event
    - {id: festive, name: Festive Sale, start: "2026-11-06", end: "2026-11-12", traffic_lift_pct: 10, banner_slots: 3}
    - {id: payday, name: Payday Sale, start: "2026-11-28", end: "2026-11-30", traffic_lift_pct: 6, banner_slots: 2}
  uplift:                        # units sold during the event = baseline x (1 - discount) ^ elasticity, capped
    default_elasticity: -3.0     # promo elasticity is steeper than everyday price elasticity (price_requests.elasticity)
    by_category: {dog dry food: -3.8, dog wet food: -4.0, cat dry food: -3.8, cat wet food: -4.0, treats: -3.4, cat litter: -3.2, grooming: -3.4, toys: -3.8, accessories: -3.4}
    max_multiplier: 4.0          # demand cannot grow without limit
    pull_forward_pct: 15         # share of the extra units that would have sold anyway after the event
  discount:
    steps_pct: [5, 10, 15, 20, 25, 30]   # depths tried per SKU
    max_pct: 25                  # no SKU is planned deeper than this
    floor_below_regular_pp: 5    # during the event the margin after funding may sit this far under the category's regular floor
  stock:
    safety_buffer_pct: 10        # event demand x (1 + this) when checking for stock-outs
    baseline_cover_days: 14      # if an order placed today can still land before the event, normal replenishment keeps at least this much cover until it starts
    min_cover_days: 3            # fewer days of baseline cover than this at the event start: leave the SKU out
    receiving_buffer_days: 2     # a stock-up PO must land this many days before the event
    pack_round_units: 10         # PO quantities round up to this
    max_stock_up_cover_days: 45  # a stock-up never takes cover beyond this many days
  funding:
    target_share_pct: 30         # the share of the markdown we ask a vendor to fund
    target_share_by_category: {dog dry food: 50, dog wet food: 50, cat dry food: 50, cat wet food: 50, cat litter: 45}   # thin everyday margins need more support
    max_ask_share_pct: 60        # a depth needing more than this to hold the margin floor is not planned
    banner_slot_cost_inr: 5000   # what a guaranteed top-banner slot costs us; charged against a vendor's funding offer
  cannibalisation:
    similarity_threshold: 0.5    # near-duplicate = same vendor, name similarity at or above this
    max_price_gap_pct: 25        # ... and prices within this %
    cannibalised_share_pct: 30   # share of a promoted SKU's extra units taken from a sibling that is not on promo
  candidates:
    max_skus_per_event: 24
    min_incremental_margin_inr: 250   # leave out a SKU whose net extra margin is below this

price_watch:                     # Run: competitor price monitor (ops_price_watch). Daily snapshots from 3 marketplaces
  window_days: 30
  undercut:
    threshold_pct: 3             # a competitor price at least this % below ours is an undercut
    min_sustained_days: 3        # ... and it is sustained after this many consecutive latest days; fewer is a blip (never matched)
    trend_window_days: 7
    trend_min_slope_pct_per_day: 0.5   # a competitor falling this % a day over the window is a trend: watched, not yet matched
  parity:                        # vendor selling cheaper elsewhere
    tolerance_pct: 3
    min_days: 3
    enforce_map: true            # also flag a vendor price under the minimum advertised price on file
  match:
    allow: true
    max_cut_pct: 12              # a cut bigger than this goes to a person
    price_round_inr: 1           # match price = competitor price rounded up to this
    margin_buffer_pp: 0          # margin after a match must stay at the category floor plus this
    comparison_share_pct: 70     # share of demand that compares prices and so reacts to a gap
    like_for_like_elasticity: -5.0   # units change by (our price / competitor price) ^ this for those shoppers: the pack is identical, so far steeper than everyday elasticity
    elasticity_by_category: {}   # optional per-category override, e.g. {treats: -6}
    horizon_days: 30
  ask_price_protection: true     # when a match would break the floor, ask the vendor to fund the gap

inventory_health:                # Run: weekly inventory health review (ops_inventory_health). Python decides every number; the model only drafts the note and vendor emails
  forecast:
    window_days: 28              # daily demand = units sold over this many latest days / this many days
    min_daily_units: 0.05        # selling slower than this a day: no cover figure, the SKU counts as not moving
  cover:                         # days of cover = units on hand / daily demand
    min_days: 14                 # on-hand cover under this is below the band
    target_days: 30              # a reorder or a clearance brings the SKU to this cover
    max_days: 60                 # on-hand cover over this is excess stock
    by_category: {}              # optional per-category band, e.g. {cat litter: {min_days: 10, target_days: 25, max_days: 50}}
  stock_out:
    safety_days: 5               # reorder is due when cover (on hand + inbound) falls under lead time + review cycle + this
    review_days: 7               # the category is reviewed weekly: an order placed at the next review lands this much later
    overdue_assumed_days: 7      # a PO line past its promised date is assumed to land this many days from today, not today
    critical_days: 3             # stock forecast to end within this many days is critical
  ageing:
    aged_days: 90                # a batch received more than this many days ago is aged
    dead_no_sale_days: 45        # stock with no sale for this many days is dead
  moq:
    overbuy_ratio: 1.5           # a PO line or reorder this many times what is needed, because of the vendor's MOQ, is an overbuy
    pack_round_units: 10         # reorder quantities with no MOQ on file round up to this
  rtv:                           # return to vendor under sell-or-return terms (terms and window dates are in data/synthetic/ops/inventory_terms.csv)
    allow: true
    min_credit_inr: 2000         # a return worth less credit than this is liquidated instead
    prefer_pct_of_liquidation: 100   # return when the vendor credit is at least this % of what a liquidation promo recovers
    urgent_window_days: 21       # a sell-or-return window with this many days or fewer left is urgent
  liquidate:
    discount_aged_pct: 25
    discount_dead_pct: 40
    discount_excess_pct: 15
    floor_pct_of_cost: 60        # a liquidation price is never under this % of cost
    uplift_multiplier: 2.0       # daily sales on the promo = this x the normal rate (sets days to clear)
    max_clear_days: 90           # a promo that would take longer than this to clear the stock does not beat a return to the vendor
    price_round_inr: 1

impact:                        # Impact meter. RESEARCH ESTIMATES (not measured) from docs/research/category-manager-workload.md; replace with a time diary of your own team, then set baseline_status to measured
  baseline_status: research_estimate   # research_estimate | measured: the UI labels every figure derived from the numbers below accordingly
  baseline_minutes:              # by-hand minutes to onboard one new vendor of about 12 SKUs (about 1,085 min). Per-SKU steps scale with the shortlist
    screening: 45
    market_research_per_sku: 20
    shortlist: 30
    negotiation_prep: 60
    negotiation_calls: 110
    conditional_offer_eval: 30
    catalog_listing_per_sku: 25
    image_content_per_sku: 10
    compliance_per_sku: 5
    marketing_jbp_draft: 60
    first_po_draft: 30
  recurring_minutes:             # by-hand minutes for recurring tasks future modules would take over (reference)
    price_increase_request: 90
    weekly_review_pack: 240
    vendor_scorecard: 75
    po_chase: 15
    fill_rate_reconciliation: 45
    catalog_fix_per_sku: 12
    promotion_event_plan: 480
    qbr_jbp_deck: 600
    competitor_price_sweep: 30
    inventory_ageing_review: 180
  team:                          # the team the saving is measured against
    category_managers: 1
    category_executives: 2
    work_hours_per_week: 45
    weeks_per_month: 4.33
    vendors_onboarded_per_month: 3.2   # 0.5 to 1 a week
    typical_skus_per_vendor: 12
  workload:                      # task -> share of each role's week (columns sum to 100) and the share of the task's time automation saves
    new_vendor_onboarding: {label: "New vendor sourcing, screening, research, negotiation, terms", category_manager_pct: 14, category_executive_pct: 9, saved_pct: 45}
    assortment_planning: {label: "Assortment planning and SKU add/drop", category_manager_pct: 7, category_executive_pct: 5, saved_pct: 30}
    price_increase_requests: {label: "Existing-vendor cost and price-increase requests", category_manager_pct: 6, category_executive_pct: 4, saved_pct: 50}
    pricing_margin: {label: "Pricing and margin management", category_manager_pct: 6, category_executive_pct: 5, saved_pct: 25}
    catalog_create_qc: {label: "Catalog create, QC and fix", category_manager_pct: 3, category_executive_pct: 18, saved_pct: 55}
    content_images: {label: "Content and images coordination", category_manager_pct: 2, category_executive_pct: 6, saved_pct: 45}
    promotions: {label: "Promotions, sale events, co-op marketing funding", category_manager_pct: 9, category_executive_pct: 7, saved_pct: 35}
    jbp_qbr: {label: "JBP, annual plan and QBR", category_manager_pct: 6, category_executive_pct: 2, saved_pct: 50}
    po_replenishment: {label: "PO raising, replenishment, fill-rate and PO follow-up", category_manager_pct: 5, category_executive_pct: 10, saved_pct: 55}
    inventory_health: {label: "Inventory health (ageing, liquidation, RTV)", category_manager_pct: 4, category_executive_pct: 5, saved_pct: 40}
    vendor_scorecards: {label: "Vendor scorecards and performance reviews", category_manager_pct: 3, category_executive_pct: 3, saved_pct: 65}
    compliance: {label: "Compliance (licences, claims, recalls)", category_manager_pct: 2, category_executive_pct: 4, saved_pct: 40}
    reporting_mis: {label: "Reporting, MIS and dashboards", category_manager_pct: 8, category_executive_pct: 9, saved_pct: 65}
    meetings: {label: "Internal meetings, escalations, alignment", category_manager_pct: 14, category_executive_pct: 5, saved_pct: 5}
    competitor_monitoring: {label: "Competitor and price monitoring", category_manager_pct: 3, category_executive_pct: 4, saved_pct: 60}
    reviews_triage: {label: "Customer reviews and complaints triage", category_manager_pct: 2, category_executive_pct: 3, saved_pct: 50}
    other: {label: "Other (admin, travel, learning)", category_manager_pct: 6, category_executive_pct: 1, saved_pct: 0}
  modules:                       # register a new module here, then add its task coverage below
    new_vendor_onboarding: {label: "New-vendor onboarding (Screen, Decide, Negotiate, Catalog, Launch packet)", status: shipped, measured_from_runs: true}
    conditional_offer_evaluator: {label: "Conditional-offer evaluator (probability, risk-adjusted value, counters)", status: shipped}   # part of the onboarding Negotiate stage; its time is the baseline's conditional_offer_eval
    live_negotiation_copilot: {label: "Live negotiation copilot (transcript, extraction, gap table, next ask)", status: shipped}   # covers the calls and notes in negotiation_calls
    weekly_review_mis: {label: "Weekly vendor-performance review and MIS generator", status: shipped}
    price_increase_evaluator: {label: "Existing-vendor price-increase evaluator (extract, margin maths, elasticity, sweetener value, counter and reply)", status: shipped}
    po_followup: {label: "PO follow-up and fill-rate chaser", status: shipped}
    catalog_qc_queue: {label: "Catalog QC and fix queue on existing SKUs", status: shipped}
    promotions_planner: {label: "Promotions and event planner", status: shipped}
    competitor_monitor: {label: "Competitor price monitor", status: shipped}
    inventory_health_module: {label: "Inventory health and liquidation", status: shipped}
  coverage:                      # module, task, and the share of that task's time the module takes over
    - {module: new_vendor_onboarding, task: new_vendor_onboarding, in_scope_pct: 100}
    - {module: new_vendor_onboarding, task: catalog_create_qc, in_scope_pct: 30}    # creation only
    - {module: new_vendor_onboarding, task: content_images, in_scope_pct: 30}
    - {module: new_vendor_onboarding, task: jbp_qbr, in_scope_pct: 20}              # first-year plan for new vendors
    - {module: new_vendor_onboarding, task: po_replenishment, in_scope_pct: 10}     # first PO
    - {module: new_vendor_onboarding, task: compliance, in_scope_pct: 30}           # at onboarding
    # The two Negotiate modules take over time that new_vendor_onboarding already counts at 100% of its task, so they add no
    # share of their own (0): registering them keeps the module list honest without counting the same hours twice.
    - {module: conditional_offer_evaluator, task: new_vendor_onboarding, in_scope_pct: 0}
    - {module: live_negotiation_copilot, task: new_vendor_onboarding, in_scope_pct: 0}
    - {module: weekly_review_mis, task: vendor_scorecards, in_scope_pct: 100}
    - {module: weekly_review_mis, task: reporting_mis, in_scope_pct: 100}
    - {module: price_increase_evaluator, task: price_increase_requests, in_scope_pct: 100}
    - {module: po_followup, task: po_replenishment, in_scope_pct: 90}
    - {module: catalog_qc_queue, task: catalog_create_qc, in_scope_pct: 70}
    - {module: promotions_planner, task: promotions, in_scope_pct: 100}
    - {module: competitor_monitor, task: competitor_monitoring, in_scope_pct: 100}
    - {module: inventory_health_module, task: inventory_health, in_scope_pct: 100}
  max_review_minutes: 120        # a review gap longer than this counts as this many minutes (the reviewer walked away)
  target_reduction_pct: 33.3     # the team view compares the saving with this goal

catalog_qc:                      # Run: QC and fix queue for the LIVE listings of existing vendors (ops_catalog). Rules reused from catalog (required attributes, title length) and screening.claim_rules
  severities:                    # low | medium | high per issue type; a claim rule's own severity wins when higher
    title_too_long: low
    title_missing_attributes: medium
    missing_attribute: medium
    banned_claim: high
    mrp_mismatch: high
    pack_mismatch: high
    duplicate_listing: medium
    wrong_category: medium
    missing_image: high
    low_res_image: medium
    high_returns_not_as_described: medium
    expired_licence: high
    label_mismatch: high
  severity_points: {low: 1, medium: 2, high: 3}   # what a severity counts as in the priority score
  priority_weights: {gmv_at_risk: 0.5, severity: 0.35, return_rate: 0.15}   # score = weighted mean of three 0-100 signals (weights are normalised)
  gmv_window_days: 28            # GMV at risk = the listing's sales over the last N days of data
  near_duplicate_threshold: 0.8  # name similarity (Jaccard overlap of title words + pack) at or above which two listings of a category are duplicates
  returns:                       # the "not as described" return signal, from the ops returns data
    threshold_pct: 0.6           # returned units citing the reasons below, as % of units sold
    min_returned_units: 5        # ...and at least this many units
    window_days: 91              # last N days of data
    reasons: [quality not as expected, wrong item sent, not as described]
  images: {min_resolution_px: 800, min_count: 1}   # shortest side of the main image; images per listing
  title_required: [brand, pack] # what a listing title must contain: brand | pack
  bulk_approve_limit: 25         # most fixes one bulk approve applies; a bigger selection is refused
  model_rewrites: true           # let the model (muse-spark) rewrite titles and bullets and fill text attributes; false = deterministic fixes only

documents:                       # Intake and Catalog: scanned vendor documents read by the vision models (muse-spark-1.3 reads, sam-3.1 crops the label panel)
  enabled: true                  # read vendor documents (certificates, labels, price lists) when the vendor has uploaded any
  min_confidence: 0.6            # a field the model reads below this confidence is not trusted (it is flagged, not compared)
  crop_padding: 0.01             # margin added around a box when it is cropped for the second read, as a share of the page
  max_pages: 3                   # pages read per document; extra pages are ignored
  kinds:                         # which kinds of document are read, and where
    - kind: licence_certificate  # id; a vendor manifest assigns each uploaded file one kind
      label: Licence certificate # shown in the UI
      stage: intake              # intake: read during Screen, and the scan is the ground truth over the declared status. catalog: read for shortlisted SKUs
      panel: false               # true: SAM finds the panel (catalog.label_panel_prompt) and that crop is read a second time
    - kind: price_list
      label: Supplier price list
      stage: intake
      panel: false
      per_sku: true              # a table: every field is read once per row, tagged with the row's SKU code
    - kind: product_label
      label: Product label
      stage: catalog
      panel: true
  fields:                        # what is read from each kind. type: text | date | pct | inr | qty | number. critical: crop the field and read it again
    - {kind: licence_certificate, name: licence_number, label: Licence number, type: text, critical: true}
    - {kind: licence_certificate, name: holder_name, label: Holder, type: text, critical: false}
    - {kind: licence_certificate, name: valid_from, label: Valid from, type: date, critical: true}
    - {kind: licence_certificate, name: valid_until, label: Valid until, type: date, critical: true}
    - {kind: price_list, name: price, label: Price per unit, type: inr, critical: true}
    - {kind: product_label, name: product_name, label: Product name, type: text, critical: false}
    - {kind: product_label, name: net_quantity, label: Net quantity, type: qty, critical: false}
    - {kind: product_label, name: mrp, label: MRP, type: inr, critical: false}
    - {kind: product_label, name: protein_pct, label: Protein, type: pct, critical: false}
    - {kind: product_label, name: fssai_number, label: Licence number on pack, type: text, critical: false}
    - {kind: product_label, name: claims_text, label: Claims on pack, type: text, critical: false}
  cross_checks:                  # pairs of sources that must agree. tolerance is in the field's unit (a fraction for pct); empty uses verifier.tolerances for that unit
    - {id: certificate_number_vs_application, label: Licence number on the scan vs the application, kind: licence_certificate, field: licence_number, against: application_document, target: number, severity: high}
    - {id: certificate_expiry_vs_application, label: Valid-until date on the scan vs the application, kind: licence_certificate, field: valid_until, against: application_document, target: valid_until, severity: high}
    - {id: certificate_holder_vs_application, label: Holder on the scan vs the applicant, kind: licence_certificate, field: holder_name, against: application_document, target: company_name, severity: medium}
    - {id: price_list_vs_sheet, label: Price list vs the SKU sheet cost, kind: price_list, field: price, against: sku_sheet, target: cost, tolerance: 1, severity: medium}
    - {id: label_protein_vs_sheet, label: Protein on the label vs the SKU sheet, kind: product_label, field: protein_pct, against: sku_sheet, pattern: '(\d+(?:\.\d+)?)\s*%\s*protein', severity: high}
    - {id: label_protein_vs_listing, label: Protein on the label vs the listing copy, kind: product_label, field: protein_pct, against: listing_copy, pattern: '(\d+(?:\.\d+)?)\s*%\s*protein', severity: high}
    - {id: label_mrp_vs_sheet, label: MRP on the label vs the SKU sheet, kind: product_label, field: mrp, against: sku_sheet, target: mrp, tolerance: 1, severity: medium}
    - {id: label_quantity_vs_sheet, label: Net quantity on the label vs the SKU sheet pack, kind: product_label, field: net_quantity, against: sku_sheet, target: pack, severity: medium}

operations:                      # Run: weekly review and PO follow-up for EXISTING vendors (ops_review, ops_chaser)
  scorecard:                     # limits that flag a vendor or SKU in the weekly review
    fill_rate_floor_pct: 90      # recent fill rate below this is flagged
    fill_rate_drop_pp: 8         # ...or a fall of this many points against the vendor's earlier fill rate
    fill_rate_recent_weeks: 4    # PO lines promised in the last N weeks are "recent"
    otif_target_pct: 85          # on time and in full target
    on_time_grace_days: 1        # delivery up to N days after the promised date still counts as on time
    in_full_min_pct: 98          # a line is in full at this share of the ordered quantity or more
    demand_window_days: 28       # daily demand for stock cover = average over this many days
    stock_cover_alert_days: 14   # fewer days of cover than this is flagged
    overstock_cover_days: 90     # more days of cover than this is overstock
    ageing_buckets_days: [30, 60, 90]   # upper edges (days since receipt); the last bucket is "older than 90"
    aged_alert_pct: 20           # flag when this share of a vendor's stock value is older than the last edge
    return_rate_alert_pct: 4     # returns over the last 4 weeks as a share of units sold
    rating_drop_alert: 0.3       # rating fell by this many stars over 4 weeks
  anomaly:                       # when a weekly movement is unusual
    growth_z_threshold: 2.5      # standard deviations from the trailing weeks
    growth_min_change_pct: 15    # ...and at least this much week on week
    lookback_weeks: 12           # trailing weeks used as the baseline
    min_weekly_units: 30         # SKUs below this are too noisy to test
  actions:                       # the "what to do this week" list
    max_actions: 8
    priority_weights: {stockout: 100, fill_rate: 70, sales_drop: 60, returns: 55, otif: 50, ageing: 45, rating: 40, overstock: 30, sales_spike: 25}   # base score per action type; severity (1 to 3) multiplies it
  po_followup:                   # PO chaser
    ladder:                      # ordered by days overdue; a PO sits on the highest rung it has reached
      - {name: Nudge, days_overdue: -2, channel: email, owner: category executive, tone: friendly}
      - {name: Chase, days_overdue: 1, channel: email+whatsapp, owner: category executive, tone: firm but polite}
      - {name: Escalate, days_overdue: 4, channel: email, owner: category manager, tone: "firm; copy the vendor's head of sales"}
      - {name: Formal notice, days_overdue: 8, channel: email, owner: category manager, tone: "formal; refer to the PO terms and name the alternative-sourcing option"}
    vague_reply_bumps_rung: true # a reply with no dated commitment moves a late PO up one rung
    stockout_buffer_days: 2      # cover must beat the remaining lead time by this many days
    default_lead_days: 7         # assumed wait for an overdue PO with no dated commitment

governance:                      # Rules page: who may change which rule. DEMO identities (synthetic names) picked in the UI, not authentication
  members:                       # the key is the member id sent as X-Acting-As
    meera: {name: Meera, role: head}
    arjun: {name: Arjun, role: manager}
    priya: {name: Priya, role: analyst}
  roles:
    head: {label: Head of category, can_apply: true, can_approve: true, sections: ["*"]}   # changes anything, approves requests
    manager:                     # own sections only, and only changes within the limits below; a bigger change becomes a request for approval
      label: Category manager
      can_apply: true
      can_approve: false
      sections: [margins, negotiation, promotions, price_watch, inventory_health, price_requests]
    analyst: {label: Category analyst, can_apply: false, can_approve: false, sections: []}   # can write a rule and see the preview, cannot apply it
  limits:                        # per change, per numeric setting under the path; only settings in this unit count (pp and % alike)
    manager_margins: {role: manager, path: margins, max_abs_change: 2, unit: pp}
  # Changing this governance section is always head-only, whatever the roles above say.
